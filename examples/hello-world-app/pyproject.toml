[project]
name = "hello-world-app"
version = "0.1.0"
description = "Tutorial Hola Mundo con OpenAI Apps SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "mcp[fastapi]>=0.1.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
